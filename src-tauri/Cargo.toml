[package]
name = "kinleaf"
version = "0.1.1"
edition = "2021"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[features]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dependencies.tauri]
version = "2"
optional = true
features = []

[dependencies.tauri-plugin-dialog]
version = "2"
optional = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "kinleaf"
path = "src/main.rs"
required-features = ["desktop"]
